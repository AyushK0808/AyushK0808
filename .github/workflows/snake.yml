name: Generate Snake Animation

on:
  schedule:
    # runs every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:   # lets you run it manually from the Actions tab
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # color_snake = dark purple snake
          # color_dots  = EXACTLY 5 colors: [0 contributions, low, ..., high]
          #               empty cell first, then a light-purple ramp
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#5a189a&color_dots=#ebedf0,#9d4edd,#b388ff,#cba6ff,#e0c3ff
            dist/github-contribution-grid-snake-dark.svg?color_snake=#5a189a&color_dots=#161b22,#9d4edd,#b388ff,#cba6ff,#e0c3ff

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
